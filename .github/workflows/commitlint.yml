name: commitlint

on:
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # First parent and no merges: a branch answers for the messages it
          # wrote itself, not for history it merged in — those were judged by
          # the request that brought them. The merge message is written by
          # GitHub, and the convention does not apply to it. Without this the
          # backmerge request fails on commits that already passed on `main`.
          for sha in $(git rev-list --first-parent --no-merges "$BASE_SHA".."$HEAD_SHA"); do
            git log -1 --pretty=%B "$sha" | npx --no-install commitlint --verbose
          done

      - name: Validate pull-request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose
