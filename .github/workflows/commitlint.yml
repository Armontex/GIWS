name: commitlint

# Also on a push into a long-lived branch: a request opened by the release or
# backmerge workflow starts no `pull_request` run at all — GitHub does not
# trigger one for a request created with the job token — so the required
# `commitlint` context has to come from the branch itself.
on:
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: commitlint
    # A request whose head is a long-lived branch is a release or a return from
    # `main`: the same commit was already checked by the push into that branch,
    # and a second run only repeats the work. Such requests are opened by a bot,
    # and GitHub holds a run started by a non-human until someone approves it —
    # that is the yellow "awaiting approval" banner on every release.
    #
    # The same-repository check is not optional: a branch name is chosen by
    # whoever created the branch, and in a fork it can be called `main`. Without
    # it a request from a fork would excuse itself from the required checks by
    # taking their name — a skipped job counts as a successful one.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !contains(fromJSON('["develop", "main"]'), github.head_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A branch's first push reports a base of nothing but zeroes; the
          # point where it left `develop` is the honest base then, not the
          # whole history from the beginning of time.
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git merge-base origin/develop "$HEAD_SHA" 2>/dev/null || true)"
          fi
          range="$HEAD_SHA"
          if [[ -n "$base" ]]; then
            range="$base..$HEAD_SHA"
          fi
          # First parent and no merges: a branch answers for the messages it
          # wrote itself, not for history it merged in — those were judged by
          # the request that brought them. The merge message is written by
          # GitHub, and the convention does not apply to it. Without this the
          # backmerge request fails on commits that already passed on `main`.
          for sha in $(git rev-list --first-parent --no-merges "$range"); do
            git log -1 --pretty=%B "$sha" | npx --no-install commitlint --verbose
          done

      # A push has no title to judge.
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose
