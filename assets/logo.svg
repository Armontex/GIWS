<!--
  No clip path on purpose. The outgoing window is drawn already cut at the
  screen edge: the panel sides are straight over that band, so the rectangle is
  exactly what a clip would produce, and the mark then renders the same in a
  browser and in a plain rasteriser.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="GIWS">
    <title>GIWS</title>
    <rect width="128" height="128" rx="28" fill="#241F31" />
    <rect x="12" y="34" width="50" height="60" rx="9" fill="#3D3846" />
    <rect x="66" y="34" width="50" height="60" rx="9" fill="#3D3846" />
    <rect x="12" y="46" width="16" height="36" fill="#77767B" opacity="0.45" />
    <rect x="34" y="46" width="28" height="36" rx="5" fill="#3584E4" />
    <rect x="52" y="46" width="10" height="36" fill="#3584E4" />
    <rect x="76" y="46" width="30" height="36" rx="5" fill="#F4A261" />
</svg>
